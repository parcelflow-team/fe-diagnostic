<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>parcel card</title>
    <style>
    .Parcel-Card {
        display: flex;
        flex: auto;
        justify-content: center;
        flex-direction: column;
        gap: 10px;
        width: 100%;
        color: white;
        font-size: 26px;
        font-family: 'Times New Roman';
    }
    .Parcel-Card h3,
    p {
        padding: 20px;
        border-radius: 12px;
        margin: 0%;
        background-color:#1e293b;
        text-align: center;
    }
    
</style>

</head>
<body>
    
<div class="Parcel-Card">
    <h3>Tracking number: RA123456789CN</h3>
    <p>Status: in-transit</p>
    <p>Destination: Amman</p>
</div>

</body>
</html>
